[project]
name = "verlichting"
version = "0.1.0"
description = "Website for sailboat Verlichting, server-side rendered with Flask"
# lower bound: 3.11 is the oldest Python still receiving security fixes; upper bound: pandas 2.2.2 has no wheels for 3.13+
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask==3.1.3",
    "pandas==2.2.2",
    "openpyxl==3.1.3",
    "python-dotenv==1.2.2",
    "tabula-py==2.10.0",
    "gunicorn==26.2.0",
]

[tool.uv]
package = false
