<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script>

	function setDataListOptions(dataList, newOptions){
            var options = dataList.getElementsByTagName('option');
            while (dataList.options.length > 0){
              dataList.removeChild(options[0]);
            }
            newOptions.forEach(function(item){
                var option = document.createElement('option');
                option.value = item;
                dataList.appendChild(option);
            });
        };

	async function updateBrandList(){
      var brandList = document.getElementById("brands")
	  var model = document.getElementById("selected_model").value
      var kind = document.getElementById("selected_kind").value

      var url = '/brands/?model=' + model + '&kind=' + kind
      const response = await fetch(url);
      const brandOptions = await response.json(); //extract JSON from the http response-->
      setDataListOptions(brandList, brandOptions);
	};

	async function updateModelList(){

	  var brand = document.getElementById("selected_brand").value
	  var modelList = document.getElementById("models")
      var kind = document.getElementById("selected_kind").value

      var url = '/models/?brand=' + brand + '&kind=' + kind
      const response = await fetch(url);
      const modelOptions = await response.json(); //extract JSON from the http response-->
      setDataListOptions(modelList, modelOptions);
	};

	async function updateKindList(){

	  var kindList = document.getElementById("product_kinds")
      var brand = document.getElementById("selected_brand").value
	  var model = document.getElementById("selected_model").value

      var url = '/kinds/?brand=' + brand + '&model=' + model
      const response = await fetch(url);
      const kindOptions = await response.json(); //extract JSON from the http response-->
      setDataListOptions(kindList, kindOptions);
	};

	async function setRepairs(brand, model, kind, page){
		console.log("start");
		var url = '/repairs/?brand=' + brand + '&model=' + model + '&kind=' + kind +'&page=' + page
        const response = await fetch(url);
        const repairs = await response.json(); //extract JSON from the http response-->
		document.getElementById("items_found").textContent = repairs.number_of_results;

		var tbodyRef = document.getElementById('repairsTable').getElementsByTagName('tbody')[0];

		tbodyRef.innerHTML = ''  //clear table

		for (let rowNumber = 0; rowNumber < repairs.results.length; rowNumber++) {

			var values = [repairs.results[rowNumber].link,
			repairs.results[rowNumber].brand,
			repairs.results[rowNumber].model,
			repairs.results[rowNumber].kind,
			repairs.results[rowNumber].repair_status]

			var newRow = tbodyRef.insertRow();  // Insert a row at the end of table

			for(let column = 0; column < 5; column++){
				var newCell = newRow.insertCell();                        // Insert a cell at the end of the row
				if (column == 0){
					var child = document.createElement('a');
				    var linkText = document.createTextNode("link");
				    child.appendChild(linkText);
				    child.href = values[column];
				} else {
					var child = document.createTextNode(values[column]);    // Append a text node to the cell
				}
				newCell.appendChild(child);
			}
		}
		console.log("end");
	};

	async function triggerSingleRepair(){
		var url = '/repairs/0418_2024_0511_240532'
        const response = await fetch(url);
        const repairs = await response.json(); //extract JSON from the http response-->
        console.log(repairs);
	};

	function onBrandSelect(){

		// todo: these "success" and "errors" are there to just wrap the asyn func. look into better way
		updateModelList().then(
			console.log("success"),
			console.log("error"),
		);
		updateKindList().then(
			console.log("success"),
			console.log("error"),
		);
	};

	function onModelSelect(){
		updateBrandList().then(
			console.log("success"),
			console.log("error"),
		);
		updateKindList().then(
			console.log("success"),
			console.log("error"),
		);
	};

	function onKindSelect(){
		updateBrandList().then(
			console.log("success"),
			console.log("error"),
		);
		updateModelList().then(
			console.log("success"),
			console.log("error"),
		);
	};

	function setPageNumber(pageNumber){
		document.getElementById("pageNumber").value = pageNumber;
	};

	function getPageNumber(){
		return Number(document.getElementById("pageNumber").value)
	};

	function setPageRange(pageNumber){
		document.getElementById("firstItemNumber").textContent = (pageNumber-1) * 10 + 1;
		document.getElementById("lastItemNumber").textContent = pageNumber*10;
	};


	function getRepairs(){
		var brand = document.getElementById("selected_brand").value
		var model = document.getElementById("selected_model").value
		var kind = document.getElementById("selected_kind").value

		var pageNumber = 0;

		setRepairs(brand, model, kind, pageNumber).then(
		    console.log("success"),
		    console.log("error"),
		);

		setPageNumber(1);

	};

	function nextPage(){
		var pageNumber = getPageNumber();
		console.log(pageNumber);


		var brand = document.getElementById("selected_brand").value
		var model = document.getElementById("selected_model").value
		var kind = document.getElementById("selected_kind").value

		setRepairs(brand, model, kind, pageNumber + 1).then(
		    console.log("success"),
		    console.log("error"),
		);

		setPageNumber(pageNumber + 1);
		setPageRange(pageNumber + 1);

	};

	function previousPage(){
		var pageNumber = getPageNumber();
		console.log(pageNumber);


		var brand = document.getElementById("selected_brand").value
		var model = document.getElementById("selected_model").value
		var kind = document.getElementById("selected_kind").value

		setRepairs(brand, model, kind, pageNumber - 1).then(
		    console.log("success"),
		    console.log("error"),
		);

		setPageNumber(pageNumber - 1);
		setPageRange(pageNumber - 1);
	};


</script>
</head>

<h1>Repairs</h1>

	Brand: <br>
	<input id="selected_brand" type="text" list="brands" onchange="onBrandSelect()"/>
	<datalist id="brands">
		{% for brand in brands %}
		<tr>
			<option value="{{ brand }}"></option>
		</tr>
		{% endfor %}
	</datalist>

	<br>

	Model: <br>
	<input id="selected_model" type="text" list="models" onchange="onModelSelect()"/>
	<datalist id="models">
	</datalist>
	<br>

	Kind of object: <br>
	<input id="selected_kind" type="text" list="product_kinds" onchange="onKindSelect()"/>
	<datalist id="product_kinds">
	</datalist>

	<br>
	<br>

<input id="clickMe" type="button" value="clickme" onclick="getRepairs()" /><br>

<br>

page <input id="pageNumber" type="number" hidden/>
<span>
	<span id="firstItemNumber">1</span> -
	<span id="lastItemNumber">10</span>
	(<span id="items_found">0</span> total)
</span><br>
<input id="previousPage" type="button" value="previous" onclick="previousPage()" />
<input id="nextPage" type="button" value="next" onclick="nextPage()" /><br>

<table id="repairsTable">
	<thead>
  <tr>
    <th>Link</th>
	<th>Brand</th>
    <th>Model</th>
    <th>Kind of product</th>
    <th>Repaired?</th>
  </tr>
  </thead>
	<tbody>
	</tbody>
</table>
